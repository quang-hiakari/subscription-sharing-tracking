name = "subscription-reminder-cron"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
# 00:00 UTC = 09:00 JST. Reminder logic computes "today" in JST itself.
crons = ["0 0 * * *"]

# Same database as the Pages app (migrations are applied from the app, not from here).
[[d1_databases]]
binding = "DB"
database_name = "subscription-tracker-db"
database_id = "882290cd-18ec-4c73-84a8-768c1cd82c90"

[vars]
# Public URL of the app, used for links in emails.
APP_URL = "https://subscriptions.quangnguyen.cc"
# Sender on a domain verified in Resend.
RESEND_FROM_EMAIL = "Subscription Notification<subscription@quangnguyen.cc>"
# Secret, set with: wrangler secret put RESEND_API_KEY -c worker/wrangler.toml
