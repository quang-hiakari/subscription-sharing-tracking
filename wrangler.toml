name = "subscription-sharing-tracking"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

routes = [
  { pattern = "subscriptions.quangnguyen.cc", custom_domain = true }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "subscription-sharing-tracking"

[[d1_databases]]
binding = "DB"
database_name = "subscription-tracker-db"
database_id = "882290cd-18ec-4c73-84a8-768c1cd82c90"
migrations_dir = "d1/migrations"
